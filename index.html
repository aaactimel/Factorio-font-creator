<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Factorio Font generator</title>
  <meta name="viewport" content="width=600, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="lang-switcher" id="lang-switcher">
    <select id="lang-select" class="lang-dropdown" aria-label="Language selection">
      <option value="en">English</option>
      <option value="ru">Русский</option>
      <option value="uk">Українська</option>
      <option value="pl">Polski</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <div class="factorio-window">
    <div class="factorio-header">
      <span id="header-title">Font Code Generator</span>
      <a href="https://github.com/aaactimel" target="_blank" rel="noopener noreferrer">
        <img align="right" src="https://img.shields.io/badge/-aaactimel-informational?logo=github&style=for-the-badge&logoColor=e66100&color=e66100&labelColor=ffffff" alt="GitHub">
      </a>
    </div>
    <div class="factorio-content">
      <label class="factorio-label" for="text-input" id="label-text">Text:</label>
      <textarea id="text-input" maxlength="130" placeholder="Enter your text...">Example text</textarea>
      <div class="factorio-row-center">
        <div class="factorio-col">
          <label id="label-font">Font:</label>
          <div class="font-select-dropdown" id="font-select-dropdown">
            <button type="button" class="font-select-btn" id="font-select-btn" aria-haspopup="true" aria-expanded="false">
              <span id="font-btn-label">default-bold</span>
              <span class="font-select-arrow">&#9662;</span>
            </button>
            <div class="font-dropdown-list" id="font-dropdown-list" role="listbox"></div>
          </div>
        </div>
        <div class="factorio-col">
          <label for="color-input" id="label-color">Color:</label>
          <input type="color" id="color-input" class="color-input" value="#e04b4b">
          <span class="hex-label" id="hex-value">#e04b4b</span>
        </div>
      </div>
      <div class="factorio-title-block" id="code-title">Generated Code:</div>
      <div class="code-output-container" id="code-visual">
        <span class="code-brackets" id="code-brackets-start">[color=#e04b4b][font=var]</span>
        <span class="code-maintext" id="code-maintext">Example text</span>
        <span class="code-end" id="code-brackets-end">[/font][/color]</span>
      </div>
      <span class="code-length" id="code-length">54 / 155</span>
      <button class="copy-btn" id="copy-btn">
        <span id="copy-btn-txt">Copy</span>
        <span class="copy-flyout" id="copy-flyout">Copied!</span>
      </button>
    </div>
  </div>

  <script src="profiles/ru.js"></script>
  <script src="profiles/en.js"></script>
  <script src="profiles/uk.js"></script>
  <script src="profiles/pl.js"></script>
  <script src="profiles/zh.js"></script>
  <script src="profiles/ja.js"></script>
  <script src="script.js"></script>
</body>
</html>
